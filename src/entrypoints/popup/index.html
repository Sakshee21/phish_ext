<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>phish_ext</title>
    <meta name="manifest.type" content="action" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>phish_ext</h1>
        <div id="status">
          <span id="status-dot" class="status-idle"></span>
          <span id="status-label">Idle</span>
        </div>
      </header>
      <section id="toggle">
        <span id="toggle-label">Scanning</span>
        <label class="switch">
          <input type="checkbox" id="enabled-toggle" checked />
          <span class="slider"></span>
        </label>
      </section>
      <section id="stats">
        <div class="stat">
          <span class="stat-label">Scans</span>
          <span class="stat-value" id="scan-count">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Threats</span>
          <span class="stat-value" id="threat-count">0</span>
        </div>
      </section>
      <section id="condition">
        <label for="condition-select">Warning condition</label>
        <select id="condition-select"></select>
      </section>
      <section id="report" hidden>
        <div class="report-context">
          <span class="report-label">Flagged as</span>
          <span id="report-brand">—</span>
          <span id="report-host" class="report-host"></span>
        </div>
        <button id="report-btn" type="button" class="report-btn">Report false positive</button>
        <small id="report-status"></small>
      </section>
      <footer>
        <button id="open-logs" type="button">View logs</button>
        <small id="version">v0.0.5</small>
      </footer>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
